alerts:
  # Người dùng phải chờ lâu hơn SLO latency trong 5 phút liên tiếp.
  - name: high_latency_p95
    severity: warning
    condition: "latency_p95 > 3000ms for 5 minutes"
    type: symptom-based
    owner: on-call-engineer
    runbook: docs/alerts.md#alert-1

  # Nhiều request thất bại, gây ảnh hưởng trực tiếp tới người dùng.
  - name: elevated_error_rate
    severity: critical
    condition: "error_rate_pct > 5 for 3 minutes"
    type: symptom-based
    owner: on-call-engineer
    runbook: docs/alerts.md#alert-2

  # Chi phí sử dụng trong ngày đã vượt ngân sách được đặt ra.
  - name: cost_budget_exceeded
    severity: warning
    condition: "daily_cost_usd > 2.5"
    type: symptom-based
    owner: team-lead
    runbook: docs/alerts.md#alert-3
